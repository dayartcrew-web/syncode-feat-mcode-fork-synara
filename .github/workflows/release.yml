name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --features devtools"
          - platform: ubuntu-22.04
            args: "--features devtools"
          - platform: windows-latest
            args: "--features devtools"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Tauri bundler names installers from tauri.conf.json's `version`,
      # NOT from the workspace Cargo.toml. Keep them in sync from the tag
      # (e.g. v0.1.24 -> 0.1.24) so release assets never carry a stale
      # version — the bug that shipped 0.1.21-named files under v0.1.22/v0.1.23.
      - name: Sync app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: crates/syncode-tauri
        run: node -e "const fs=require('fs');const p='tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));const tag=process.env.GITHUB_REF_NAME.replace(/^v/,'');c.version=tag;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');console.log('tauri.conf.json version synced to',tag)"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/syncode-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Syncode ${{ github.ref_name }}"
          releaseBody: "Syncode desktop app installer with auto-update support. Download the appropriate file for your platform."
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
